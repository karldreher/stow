[package]
name = "stow"
version = "0.3.0"
edition = "2024"
description = "Minimal local in-memory KV server for process coordination"
license = "MIT"
publish = false

[lib]
name = "stow"
path = "src/lib.rs"

[[bin]]
name = "stow"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
bytes = { version = "1", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
http-body-util = { version = "0.1", default-features = false }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "signal", "macros", "time", "sync"] }
utoipa = { version = "5", default-features = false, features = ["macros"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "rt", "net", "macros", "sync", "time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
missing_docs = "warn"
dead_code = "deny"

[lints.clippy]
missing_docs_in_private_items = "warn"
allow_attributes = "deny"

[package]
name = "stow"
version = "0.1.0"
edition = "2024"
description = "Minimal local in-memory KV server for agent coordination"
license = "MIT"
publish = false

[lib]
name = "stow"
path = "src/lib.rs"

[[bin]]
name = "stow"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
bytes = { version = "1", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "net", "signal", "macros", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "rt", "net", "macros", "sync"] }

[lints.rust]
missing_docs = "warn"
dead_code = "deny"

[lints.clippy]
missing_docs_in_private_items = "warn"
allow_attributes = "deny"
